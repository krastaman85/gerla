# .github/workflows/gerla-aggiorna.yml
# Giro quotidiano, leggero: promozioni, carburanti e cambio.
# Dura una quindicina di secondi perché non rifà quello che non cambia:
# i prezzi di listino e il Nutri-Score si aggiornano nel giro settimanale.
name: Aggiorna listino Gerla
on:
  schedule:
    # 05:15 UTC = 07:15 in Ticino d'estate, 06:15 d'inverno.
    # Le offerte svizzere escono il martedì e il giovedì, quelle italiane il
    # lunedì: alle sette del mattino sono già tutte pubblicate.
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      completo:
        description: "Giro completo (prezzi e Nutri-Score, ~12 minuti)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: listino
  cancel-in-progress: false
jobs:
  listino:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prezzi, carburanti e cambio
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then
            echo "Giro completo richiesto a mano."
            node gerla-aggiorna.mjs --html gerla.html --out gerla-listino.json --skrimpers 400 --nutri 60
          else
            node gerla-aggiorna.mjs --html gerla.html --out gerla-listino.json --leggero
          fi

      - name: Offerte in corso
        run: node gerla-catalogo.mjs --promozioni

      - name: Lega gli ingredienti ai prodotti veri
        run: |
          if [ -d catalogo ]; then
            node gerla-lega.mjs --html gerla.html --catalogo catalogo --out gerla-ingredienti.json
          else
            echo "::warning::Manca la cartella catalogo/: la legatura viene saltata."
          fi

      - name: Allinea la versione dell'app installata
        run: |
          # Il browser si accorge di una versione nuova solo se gerla-sw.js cambia
          # byte per byte. Senza questo passo, dimenticare di aggiornare la riga a
          # mano significa che chi ha installato l'app non riceve mai le modifiche.
          if [ -f gerla.html ] && [ -f gerla-sw.js ]; then
            IMPRONTA=$(md5sum gerla.html | cut -c1-8)
            ATTUALE=$(grep -o 'const VERSIONE = "[^"]*"' gerla-sw.js | sed 's/.*"\(.*\)"/\1/')
            NUOVA="gerla-$(date +%Y-%m-%d)-$IMPRONTA"
            if [ "$ATTUALE" != "$NUOVA" ]; then
              sed -i "s|const VERSIONE = \"[^\"]*\"|const VERSIONE = \"$NUOVA\"|" gerla-sw.js
              echo "Versione dell'app: $ATTUALE -> $NUOVA"
            else
              echo "Versione dell'app già allineata: $ATTUALE"
            fi
          fi

      - name: Pubblica
        run: |
          git config user.name "Gerla"
          git config user.email "gerla@users.noreply.github.com"
          git add gerla-listino.json gerla-promozioni.json gerla-ingredienti.json gerla-sw.js
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da pubblicare."
            exit 0
          fi
          git commit -m "Listino e offerte del $(date +%F)"
          for tentativo in 1 2 3; do
            if git push; then echo "Pubblicato al tentativo $tentativo."; exit 0; fi
            echo "Il deposito è cambiato nel frattempo: mi riallineo e riprovo."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              git checkout --ours gerla-listino.json gerla-promozioni.json gerla-ingredienti.json gerla-sw.js || true
              git add gerla-listino.json gerla-promozioni.json gerla-ingredienti.json gerla-sw.js
              git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "::error::Pubblicazione non riuscita dopo tre tentativi."
          exit 1
