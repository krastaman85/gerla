# .github/workflows/gerla-aggiorna.yml
# Aggiorna il listino ogni mattina e lo pubblica: l'app lo legge a ogni apertura.
name: Aggiorna listino Gerla
on:
  schedule:
    - cron: "15 5 * * *"      # tutti i giorni alle 05:15 UTC (07:15 in Ticino d'estate)
  workflow_dispatch:           # e ogni volta che premi tu
permissions:
  contents: write
concurrency:                   # una sola esecuzione per volta, niente sovrapposizioni
  group: listino
  cancel-in-progress: false
jobs:
  listino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # i runner GitHub non eseguono più Node 20
      - name: Estrai i prezzi dalle fonti aperte
        run: node gerla-aggiorna.mjs --html gerla.html --out gerla-listino.json --skrimpers 160 --nutri 40
      - name: Pubblica il listino aggiornato
        run: |
          git config user.name "Gerla"
          git config user.email "gerla@users.noreply.github.com"
          git add gerla-listino.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione: niente da pubblicare."
            exit 0
          fi
          git commit -m "Listino del $(date +%F)"

          # Il deposito può essere andato avanti mentre lo script lavorava
          # (per esempio un caricamento fatto a mano dalla pagina web):
          # prima di insistere riallineo e riprovo, fino a tre volte.
          for tentativo in 1 2 3; do
            if git push; then
              echo "Pubblicato al tentativo $tentativo."
              exit 0
            fi
            echo "Il deposito è cambiato nel frattempo: mi riallineo e riprovo."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              echo "Riallineamento non riuscito: tengo la mia versione del listino."
              git checkout --ours gerla-listino.json || true
              git add gerla-listino.json
              git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "::error::Pubblicazione non riuscita dopo tre tentativi."
          exit 1
