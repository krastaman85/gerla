# .github/workflows/gerla-catalogo.yml
# Il catalogo dei negozi cambia poco: si rigenera una volta a settimana.
# Le promozioni invece cambiano ogni settimana: le rigenera il flusso giornaliero.
name: Catalogo esteso Gerla
on:
  schedule:
    - cron: "40 4 * * 1"       # ogni lunedì alle 04:40 UTC (06:40 in Ticino d'estate)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogo
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Scarica il catalogo dei nove negozi
        run: node gerla-catalogo.mjs --indice --max 40000
      - name: Rilega gli ingredienti sul catalogo nuovo
        run: node gerla-lega.mjs --html gerla.html --catalogo catalogo --out gerla-ingredienti.json
      - name: Pubblica il catalogo aggiornato
        run: |
          git config user.name "Gerla"
          git config user.email "gerla@users.noreply.github.com"
          git add catalogo gerla-ingredienti.json
          if git diff --staged --quiet; then
            echo "Catalogo invariato: niente da pubblicare."
            exit 0
          fi
          git commit -m "Catalogo dei negozi del $(date +%F)"
          for tentativo in 1 2 3; do
            if git push; then echo "Pubblicato al tentativo $tentativo."; exit 0; fi
            echo "Il deposito è cambiato nel frattempo: mi riallineo e riprovo."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
              git checkout --ours catalogo || true
              git add catalogo gerla-ingredienti.json
              git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "::error::Pubblicazione non riuscita dopo tre tentativi."
          exit 1
